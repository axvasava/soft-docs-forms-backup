<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml">
	<head>
		<title>New Etrieve Form</title>
		<link rel="stylesheet" href="bootstrap.min.css" />
		<!-- <script src="jquery-2.2.0.min.js"></script>  <script src="JS.js"></script> -->
		<link
			rel="stylesheet"
			href="https://code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css"
		/>
		<style>
			.ui-datepicker {
				position: relative;
				z-index: 10000 !important;
			}
		</style>
		<style>
			.page {
				margin: 10px auto;
				border: 1px solid #ddd;
				box-shadow: 0 0 30px grey;
				padding: 10px;
				background-color: white;
			}
		</style>
	</head>

	<body>
		<div class="page container">
			<div id="row1" class="text-left row">
				<div id="col2" class="col-xs-12 col-sm-6 text-left">
					<button
						type="button"
						id="ele3"
						name="ele3"
						class="text-left btn btn-primary"
					>
						Send
					</button>
				</div>
			</div>

			<div class="row" style="margin-top: 20px">
				<div class="col-xs-12">
					<h4>Ticket Response</h4>
					<pre data-bind="text: ticketResponse"></pre>
				</div>
			</div>
		</div>
	</body>
</html>
